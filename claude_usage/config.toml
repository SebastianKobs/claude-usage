# Defaults for claude-usage, shipped with the package. Override any key in ~/.config/claude-usage/config.toml
# (or config.local.toml in a source checkout): tables are merged key by key, everything else is replaced.
# Relative paths here count from the data folder: data/ in a source checkout, else ~/.local/share/claude-usage.

# Claude Code's transcripts, one folder per project.
projects_dir = "~/.claude/projects"

# The SQLite usage history.
store = "usage.sqlite"

# How many days of history the store keeps: 7, 30, 90 or 365, or 0 for everything. After each scan, sessions whose
# last activity is older are deleted from the store, and the dashboard offers no longer range. Claude Code deletes
# its transcripts after 30 days by default, so a longer retention is what keeps usage past that.
retention_days = 30

# When the [prices] below were last checked against the official pricing page.
prices_checked = 2026-09-27

# Flat fees, independent of the model and not multiplied by fast mode.
[fees]
web_search_per_1000 = 10.0      # $ per 1,000 web searches, e.g. Claude Code's WebSearch tool

[serve]
port = 8765
live_minutes = 5        # a session counts as live if its transcript changed within this many minutes

# When the conversation in a session's view hints at compacting. Anthropic publishes no "normal" context size, only
# that quality degrades as the context fills (code.claude.com/docs/en/best-practices), so the soft hint is a
# heuristic: 200K matches Claude Code's exceeds_200k_tokens flag. The Input tokens tile shows your median and p90
# context per turn; pick a threshold from those.
[chat]
compact_hint_tokens = 200000
auto_compact_warn_share = 0.8  # the stronger warning, from this share of the auto-compact point on
# After the first hint of each kind, a short reminder at each milestone: every further 50% of the hint threshold
# (300K, 400K, ... at 200K), and every further 5% of the auto-compact point (85%, 90%, 95%).
compact_reminder_step = 0.5
auto_compact_reminder_step = 0.05

# Where Claude Code auto-compacts, by model id prefix (the longest match wins, a [1m] suffix is ignored): about 967K
# on models with a native 1M window, at 200K on 200K windows (code.claude.com/docs/en/model-config, 2026-09-27).
# Set default to your autoCompactWindow or CLAUDE_CODE_AUTO_COMPACT_WINDOW if you changed it.
[auto_compact]
default = 967000
"claude-haiku-4-5" = 200000
"claude-sonnet-4-5" = 200000
"claude-3-5-haiku" = 200000

# Prices in $ per million tokens, by model id prefix: the longest matching prefix wins, so "claude-opus-5-5"
# beats "claude-opus-5". Source: platform.claude.com/docs/en/about-claude/pricing (Claude API, first party).
# - Cache writes cost 1.25x (5m) and 2x (1h) of base input. Cache reads cost 0.1x, except on Fable 5.1 and
#   Mythos 5.1 (0.025x) and Opus 5.5 (0.05x).
# - fast_multiplier: fast mode (Opus 5.5, Opus 5 and Opus 4.8 only) costs 2x on every category, cache included.
#   Without a multiplier, fast requests are billed at standard rates (Opus 4.6 does that).
# - No long-context surcharge on 4.6 and later models: the full 1M window is billed at these rates.
# - Not included: 1.1x for US-only inference (inference_geo), the Batch discount.
[prices."claude-fable-5-1"]
input = 10.0
cache_write_5m = 12.50
cache_write_1h = 20.0
cache_read = 0.25
output = 50.0

[prices."claude-mythos-5-1"]
