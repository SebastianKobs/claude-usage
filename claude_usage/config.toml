# Defaults for claude-usage, shipped with the package. Override any key in ~/.config/claude-usage/config.toml
# (or config.local.toml in a source checkout): tables are merged key by key, everything else is replaced.
# Relative paths here count from the data folder: data/ in a source checkout, else ~/.local/share/claude-usage.

# Claude Code's transcripts, one folder per project.
projects_dir = "~/.claude/projects"

# The SQLite usage history. It keeps what Claude Code deletes after its cleanup period.
store = "usage.sqlite"

# When the [prices] below were last checked against the official pricing page.
prices_checked = 2026-09-27

# Flat fees, independent of the model and not multiplied by fast mode.
[fees]
web_search_per_1000 = 10.0      # $ per 1,000 web searches, e.g. Claude Code's WebSearch tool

[serve]
port = 8765
live_minutes = 5        # a session counts as live if its transcript changed within this many minutes

# Prices in $ per million tokens, by model id prefix: the longest matching prefix wins, so "claude-opus-5-5"
# beats "claude-opus-5". Source: platform.claude.com/docs/en/about-claude/pricing (Claude API, first party).
# - Cache writes cost 1.25x (5m) and 2x (1h) of base input. Cache reads cost 0.1x, except on Fable 5.1 and
#   Mythos 5.1 (0.025x) and Opus 5.5 (0.05x).
# - fast_multiplier: fast mode (Opus 5.5, Opus 5 and Opus 4.8 only) costs 2x on every category, cache included.
#   Without a multiplier, fast requests are billed at standard rates (Opus 4.6 does that).
# - No long-context surcharge on 4.6 and later models: the full 1M window is billed at these rates.
# - Not included: 1.1x for US-only inference (inference_geo), the Batch discount.
[prices."claude-fable-5-1"]
input = 10.0
cache_write_5m = 12.50
cache_write_1h = 20.0
cache_read = 0.25
output = 50.0

