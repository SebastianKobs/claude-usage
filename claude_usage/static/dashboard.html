<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude usage</title>
<link rel="stylesheet" href="/static/css/themes/light.css">
<link rel="stylesheet" href="/static/css/themes/dark.css">
<link rel="stylesheet" href="/static/css/themes/fun.css">
<link rel="stylesheet" href="/static/css/themes/hacker.css">
<link rel="stylesheet" href="/static/css/themes/startup.css">
<link rel="stylesheet" href="/static/css/themes/rgb.css">
<link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
<main>
  <header>
    <h1 data-label="Claude usage">Claude usage</h1>
    <span id="scope" class="muted"></span>
    <span class="spacer"></span>
    <span id="updated" class="muted"></span>
    <label class="theme-picker"><span class="muted">Theme</span>
      <select id="theme">
        <option value="auto">auto</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
        <optgroup label="Just for fun">
          <option value="hacker">terminal hacker 💻</option>
          <option value="startup">startup flex ✨</option>
          <option value="rgb">RGB battlestation 🌈</option>
        </optgroup>
      </select>
    </label>
  </header>

  <div id="error" class="banner" role="alert"></div>

  <div id="session-card"></div>

  <div class="filters" id="filters" role="group" aria-label="Filters"></div>

  <div id="summary">
    <div class="kpis stack" id="kpis"></div>
    <div class="kpis stack" id="runtime" role="group" aria-label="Time and lines changed"></div>

    <div id="live-card"></div>

    <div id="trend-card"></div>

    <div id="chart-card"></div>

    <div id="costly-card"></div>

    <div id="limits-card"></div>

    <div id="usage-cards"></div>

    <div id="sessions-card"></div>
  </div>

  <footer id="footer"></footer>
</main>

<script type="module" src="/static/js/app.js"></script>
<script src="/static/js/util.js" defer></script>
<script src="/static/js/state.js" defer></script>
<script src="/static/js/chartkit.js" defer></script>
<script src="/static/js/tables.js" defer></script>
<script src="/static/js/drilldown.js" defer></script>
<script src="/static/js/themes.js" defer></script>
<script src="/static/js/main.js" defer></script>
</body>
</html>
