<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude usage</title>
<link rel="stylesheet" href="/static/css/themes/light.css">
<link rel="stylesheet" href="/static/css/themes/dark.css">
<link rel="stylesheet" href="/static/css/themes/fun.css">
<link rel="stylesheet" href="/static/css/themes/hacker.css">
<link rel="stylesheet" href="/static/css/themes/startup.css">
<link rel="stylesheet" href="/static/css/themes/rgb.css">
<link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
<main>
  <header>
    <h1 data-label="Claude usage">Claude usage</h1>
    <span id="scope" class="muted"></span>
    <span class="spacer"></span>
    <span id="updated" class="muted"></span>
    <label class="theme-picker"><span class="muted">Theme</span>
      <select id="theme">
        <option value="auto">auto</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
        <optgroup label="Just for fun">
          <option value="hacker">terminal hacker 💻</option>
          <option value="startup">startup flex ✨</option>
          <option value="rgb">RGB battlestation 🌈</option>
        </optgroup>
      </select>
    </label>
  </header>

  <div id="error" class="banner" role="alert"></div>

  <section id="drilldown" class="card" aria-labelledby="drilldown-title" hidden></section>

  <div class="filters" id="filters" role="group" aria-label="Filters">
    <span class="label">Range</span>
    <div class="segmented" id="range">
      <button type="button" data-days="1">Daily</button>
      <!-- right after Daily, and only while it is selected -->
      <div class="day-nav" id="day-nav" role="group" aria-label="Day" hidden>
        <button type="button" id="day-prev" aria-label="Previous day">‹</button>
        <output id="day-label" aria-live="polite"></output>
        <button type="button" id="day-next" aria-label="Next day">›</button>
      </div>
      <button type="button" data-days="7">7 days</button>
      <button type="button" data-days="30">30 days</button>
      <button type="button" data-days="90">90 days</button>
      <button type="button" data-days="365">1 year</button>
    </div>
  </div>

  <div id="summary">
    <div class="kpis stack" id="kpis"></div>
    <div class="kpis stack" id="runtime" role="group" aria-label="Time and lines changed"></div>

    <section class="card" aria-labelledby="live-title">
      <h2 id="live-title"><span data-label="Live sessions">Live sessions</span> <span id="live-window" class="muted"></span></h2>
      <div id="live" class="paged-wrap"></div>
    </section>

    <div id="trend-card"></div>

    <div id="chart-card"></div>

    <div id="costly-card"></div>

    <div id="limits-card"></div>

    <div id="usage-cards"></div>

    <section class="card" aria-labelledby="sessions-title">
      <h2 id="sessions-title"><span data-label="Sessions">Sessions</span>
        <span class="muted">what each used in the range</span></h2>
      <div class="table-filters" role="search" aria-label="Filter the sessions">
        <select id="sessions-project" aria-label="Project"><option value="">All projects</option></select>
        <input type="search" id="sessions-search" aria-label="Filter by title, project or session id"
               placeholder="Title, project or id" autocomplete="off" spellcheck="false">
        <span class="muted" id="sessions-count" aria-live="polite"></span>
      </div>
      <div id="sessions" class="table-wrap"></div>
    </section>
  </div>

  <footer id="footer"></footer>
</main>

<script type="module" src="/static/js/app.js"></script>
<script src="/static/js/util.js" defer></script>
<script src="/static/js/state.js" defer></script>
<script src="/static/js/figures.js" defer></script>
<script src="/static/js/chartkit.js" defer></script>
<script src="/static/js/tables.js" defer></script>
<script src="/static/js/limits.js" defer></script>
<script src="/static/js/vendor/highlight.min.js" defer></script>
<script src="/static/js/vendor/marked.umd.min.js" defer></script>
<script src="/static/js/vendor/purify.min.js" defer></script>
<script src="/static/js/chat.js" defer></script>
<script src="/static/js/drilldown.js" defer></script>
<script src="/static/js/themes.js" defer></script>
<script src="/static/js/main.js" defer></script>
</body>
</html>
